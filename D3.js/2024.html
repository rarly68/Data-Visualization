<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>Four-Quadrant Analysis</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: sans-serif; }
  .tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    background: rgba(0,0,0,.8); color: #fff;
    padding: 6px 10px; border-radius: 4px; font-size: 12px; line-height: 1.5;
  }
  .quad-label { font-size: 12px; font-weight: bold; fill: gray; opacity: .75; }
</style>
</head>
<body>
<div id="chart"></div>
<div class="tooltip" id="tooltip"></div>

<script>
const universityColors = { SMU: "#029E73", NUS: "#DE8F05", NTU: "#0173B2", SUTD: "#CC78BC",
 SUSS: "#ECE133", SIT: "#949494" };
const univMap = {
  "Singapore Management University": "SMU",
  "National University of Singapore": "NUS",
  "Nanyang Technological University": "NTU",
  "Singapore University of Technology and Design": "SUTD",
  "Singapore University of Social Sciences": "SUSS",
  "Singapore Institute of Technology": "SIT"
};

const universityShapes = {
  SMU: d3.symbolCircle,
  NUS: d3.symbolSquare,
  NTU: d3.symbolTriangle,
  SUTD: d3.symbolDiamond,
  SUSS: d3.symbolStar,
  SIT: d3.symbolWye
};
const symbolSize = 90;       // 一般大小（面積，單位 px²）
const symbolSizeHover = 220; // hover 時的大小

function lowess(xs, ys, frac = 0.5, it = 3) {
  const n = xs.length;
  const order = d3.range(n).sort((a, b) => xs[a] - xs[b]);
  const x = order.map(i => xs[i]);
  const y = order.map(i => ys[i]);
  const k = Math.max(2, Math.min(n, Math.ceil(frac * n))); // 每點使用的鄰近點數

  let robust = new Array(n).fill(1);
  let fit = new Array(n).fill(0);

  for (let iter = 0; iter <= it; iter++) {
    for (let i = 0; i < n; i++) {
      const dist = x.map(xj => Math.abs(xj - x[i]));
      const h = [...dist].sort(d3.ascending)[k - 1]; // 第 k 近的距離 = 頻寬

      // tricube 權重 × robust 權重
      const w = dist.map((d, j) => {
        if (h === 0) return d === 0 ? robust[j] : 0;
        const u = d / h;
        return u < 1 ? Math.pow(1 - u ** 3, 3) * robust[j] : 0;
      });

      // 加權線性回歸
      let sw = 0, swx = 0, swy = 0, swxx = 0, swxy = 0;
      for (let j = 0; j < n; j++) {
        sw   += w[j];
        swx  += w[j] * x[j];
        swy  += w[j] * y[j];
        swxx += w[j] * x[j] * x[j];
        swxy += w[j] * x[j] * y[j];
      }
      const denom = sw * swxx - swx * swx;
      if (sw === 0) { fit[i] = y[i]; continue; }
      if (Math.abs(denom) < 1e-12) {
        fit[i] = swy / sw;
      } else {
        const slope = (sw * swxy - swx * swy) / denom;
        const intercept = (swy - slope * swx) / sw;
        fit[i] = intercept + slope * x[i];
      }
    }

    // 更新 robust 權重（bisquare），最後一輪不需要
    if (iter < it) {
      const res = y.map((yi, i) => yi - fit[i]);
      const s = d3.median(res.map(Math.abs));
      robust = res.map(r => {
        if (s === 0) return 1;
        const u = Math.abs(r) / (6 * s);
        return u < 1 ? (1 - u * u) ** 2 : 0;
      });
    }
  }
  return x.map((xi, i) => [xi, fit[i]]);
}

async function main() {
  try {
    const df = await d3.csv("data.csv", d3.autoType);
    drawChart(df);
  } catch (err) {
    console.error(err);
    d3.select("#chart").append("p").style("color", "red")
      .text("資料載入失敗：" + err.message);
  }
}

function drawChart(df) {
  const margin = { top: 60, right: 40, bottom: 70, left: 80 };
  const width  = 1100 - margin.left - margin.right;
  const height = 800  - margin.top  - margin.bottom;

  const df2024 = df.filter(d => d.year === 2024)
    .map(d => ({ ...d, univ_abbr: univMap[d.university] }));
  if (!df2024.length) return;

  const nationalEmp    = df2024[0].emp_rate;
  const nationalIncome = df2024[0].median_income_incl_emp_cpf;

  const data = df2024.filter(d =>
    d.gross_monthly_median != null && d.employment_rate_overall != null);

  const svg = d3.select("#chart").append("svg")
    .attr("width",  width  + margin.left + margin.right)
    .attr("height", height + margin.top  + margin.bottom)
    .append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  // ---- 比例尺 ----
  const xMin = d3.min(data, d => d.gross_monthly_median) - 100;
  const xMax = d3.max(data, d => d.gross_monthly_median) + 300;
  const yMin = d3.min(data, d => d.employment_rate_overall) - 3;
  const yMax = 102;
  const x = d3.scaleLinear().domain([xMin, xMax]).range([0, width]);
  const y = d3.scaleLinear().domain([yMin, yMax]).range([height, 0]);

  // ---- 格線 ----
  svg.append("g").attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x).tickSize(-height).tickFormat(""))
    .call(g => g.selectAll("line").attr("stroke", "#ccc").attr("stroke-dasharray", "2,3"))
    .call(g => g.select(".domain").remove());
  svg.append("g")
    .call(d3.axisLeft(y).tickSize(-width).tickFormat(""))
    .call(g => g.selectAll("line").attr("stroke", "#ccc").attr("stroke-dasharray", "2,3"))
    .call(g => g.select(".domain").remove());

  // ---- 座標軸 ----
  svg.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x));
  svg.append("g").call(d3.axisLeft(y));

  // ---- 軸名稱 ----
  svg.append("text")
    .attr("x", width / 2).attr("y", height + 50)
    .attr("text-anchor", "middle").style("font-size", "13px")
    .text("Median Income (SGD)");

  svg.append("text")
    .attr("transform", "rotate(-90)")
    .attr("x", -height / 2).attr("y", -55)
    .attr("text-anchor", "middle").style("font-size", "13px")
    .text("Employment Rate (%)");

  // ---- 標題 ----
  svg.append("text")
    .attr("x", width / 2).attr("y", -25)
    .attr("text-anchor", "middle")
    .style("font-size", "16px").style("font-weight", "bold")
    .text("2024 Singapore University Graduates' Four-Quadrant Analysis");

  // ---- 四象限分隔線 ----
  svg.append("line")
    .attr("x1", 0).attr("x2", width)
    .attr("y1", y(nationalEmp)).attr("y2", y(nationalEmp))
    .attr("stroke", "red").attr("stroke-width", 1.5).attr("stroke-dasharray", "6,4");

  svg.append("line")
    .attr("x1", x(nationalIncome)).attr("x2", x(nationalIncome))
    .attr("y1", 0).attr("y2", height)
    .attr("stroke", "blue").attr("stroke-width", 1.5).attr("stroke-dasharray", "6,4");

  // ---- 分隔線上的數值標示 ----
  svg.append("text")
    .attr("x", width - 5).attr("y", y(nationalEmp) - 6)
    .attr("text-anchor", "end").attr("fill", "red")
    .style("font-size", "12px").style("font-weight", "bold")
    .text(`National Emp. Rate: ${nationalEmp}%`);

  svg.append("text")
    .attr("x", x(nationalIncome) + 6).attr("y", 14)
    .attr("text-anchor", "start").attr("fill", "blue")
    .style("font-size", "12px").style("font-weight", "bold")
    .text(`National Median Income: $${nationalIncome}`);

  // ---- 象限文字（支援換行）----
  function addQuadLabel(px, py, text, anchor = "start") {
    const lines = text.split("\n");
    const t = svg.append("text").attr("class", "quad-label")
      .attr("x", px).attr("y", py).attr("text-anchor", anchor);
    lines.forEach((line, i) => {
      t.append("tspan").attr("x", px).attr("dy", i === 0 ? 0 : "1.3em").text(line);
    });
  }

  const xRight = x(nationalIncome) + 15;
  const xLeft  = x(xMin) + 15;
  const yTop    = y(98);
  const yBottom = y(72);

  // I 右上
  addQuadLabel(xRight, yTop, "I: High Income\nHigh Employment");
  // II 左上
  addQuadLabel(xLeft,  yTop, "II: Low Income\nHigh Employment");
  // III 左下
  addQuadLabel(xLeft,  yBottom, "III: Low Income\nLow Employment");
  // IV 右下
  addQuadLabel(xRight, yBottom, "IV: High Income\nLow Employment");

  // ---- LOWESS 回歸線 ----
  const lowessResult = lowess(
    data.map(d => d.gross_monthly_median),
    data.map(d => d.employment_rate_overall),
    0.5
  );

  let lowessVisible = false; 

  const lowessPath = svg.append("path")
    .datum(lowessResult)
    .attr("fill", "none")
    .attr("stroke", "#D55E00")
    .attr("stroke-width", 2)
    .attr("pointer-events", "none")
    .style("opacity", 0)                  // 預設隱藏
    .attr("d", d3.line()
      .x(d => x(d[0]))
      .y(d => y(d[1]))
      .curve(d3.curveMonotoneX));

  // ---- 散布點 + Tooltip ----
  const tooltip = d3.select("#tooltip");

  const symbolGen = d3.symbol();
  const getPath = (d, size = symbolSize) =>
    symbolGen.type(universityShapes[d.univ_abbr] || d3.symbolCircle).size(size)();

  svg.selectAll("path.point")
    .data(data).join("path")
    .attr("class", "point")
    .attr("d", d => getPath(d))
    .attr("transform", d =>
      `translate(${x(d.gross_monthly_median)},${y(d.employment_rate_overall)})`)
    .attr("fill", d => universityColors[d.univ_abbr] || "#7f7f7f")
    .attr("fill-opacity", 0.8)
    .attr("stroke", "white").attr("stroke-width", 0.5)
    .on("mouseover", function (event, d) {
      d3.select(this)
        .attr("d", getPath(d, symbolSizeHover))
        .attr("stroke", "black");
      tooltip.style("opacity", 1).html(
        `<b>${d.degree}</b><br>${d.univ_abbr ?? d.university}<br>` +
        `Income: $${d.gross_monthly_median}<br>` +
        `Employment: ${d.employment_rate_overall}%`);
    })
    .on("mousemove", event => {
      tooltip.style("left", (event.pageX + 12) + "px")
             .style("top",  (event.pageY - 28) + "px");
    })
    .on("mouseout", function (event, d) {
      d3.select(this)
        .attr("d", getPath(d))
        .attr("stroke", "white");
      tooltip.style("opacity", 0);
    });


  // ---- 圖例 ----
  const items = [
    ...Object.entries(universityColors).map(([name, color]) => ({
      name, color, type: "symbol", shape: universityShapes[name]
    })),
    { name: `National Emp. Rate (${nationalEmp}%)`, color: "red",  type: "line", dash: "4,2" },
    { name: `National Median Income ($${nationalIncome})`, color: "blue", type: "line", dash: "4,2" },
    { name: "LOWESS (frac = 0.5)", color: "#D55E00", type: "line", dash: null }
  ];
  const lw = 270, lh = items.length * 22 + 35;
  const legend = svg.append("g")
    .attr("transform", `translate(${width - lw - 10},${height - lh - 10})`);
  legend.append("rect").attr("width", lw).attr("height", lh)
    .attr("fill", "white").attr("stroke", "#ccc").attr("rx", 4);
  legend.append("text").attr("x", 10).attr("y", 20)
    .style("font-weight", "bold").style("font-size", "12px").text("University");

  items.forEach((it, i) => {
    const g = legend.append("g")
      .attr("transform", `translate(10,${35 + i * 22})`);

    if (it.type === "symbol") {
      g.append("path")
        .attr("d", d3.symbol().type(it.shape).size(symbolSize)())
        .attr("transform", "translate(9,6)")
        .attr("fill", it.color)
        .attr("fill-opacity", 0.8)
        .attr("stroke", "white").attr("stroke-width", 0.5);
    } else {
      g.append("line").attr("x1", 0).attr("x2", 18).attr("y1", 6).attr("y2", 6)
        .attr("stroke", it.color)
        .attr("stroke-width", it.dash ? 1.5 : 2)
        .attr("stroke-dasharray", it.dash);
    }
    const label = g.append("text").attr("x", 26).attr("y", 11)
      .style("font-size", "12px").text(it.name);

    // LOWESS 項目：可點擊切換
    if (it.name.startsWith("LOWESS")) {
      g.style("cursor", "pointer")
        .style("opacity", 0.4)    // 預設為灰色（代表隱藏）
        .on("click", function () {
          lowessVisible = !lowessVisible;
          lowessPath.transition().duration(300)
            .style("opacity", lowessVisible ? 1 : 0);
          d3.select(this).style("opacity", lowessVisible ? 1 : 0.4);
          label.text(it.name + (lowessVisible ? "" : " (click to show)"));
        });
      label.text(it.name + " (click to show)");
    }
  });
  
}

main();
</script>
</body>
</html>
